name: Refresh Vi catalog and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
concurrency:
  group: vi-catalog-pages
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Preserve rolling public release archive
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/releases.json data/last-update.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public Vi release archive"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@v4
